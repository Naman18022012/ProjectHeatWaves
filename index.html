<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INKSPIRE Digital Newsletter - Presidency School Banashankari</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --ps-blue-dark: #002347;
            --ps-blue-mid: #103a6b;
            --ps-gold-rich: #c5a059;
            --ps-gold-bright: #e5c158;
            --ps-cream: #fdfbf7;
            --ps-shadow: 0 20px 50px rgba(0, 35, 71, 0.25);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #002347 50%, #091e36 100%);
            min-height: 100vh;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .brand-header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            letter-spacing: 3px;
            color: var(--ps-gold-bright);
        }

        .brand-header p {
            font-size: 0.95rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .flipbook-window {
            width: 100%;
            max-width: 1040px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            overflow: hidden;
            border: 1px solid rgba(197, 160, 89, 0.3);
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--ps-gold-bright);
            transition: width 0.1s linear;
        }

        .toolbar {
            background: var(--ps-blue-dark);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid var(--ps-gold-rich);
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn:hover, .btn.active {
            background: var(--ps-gold-rich);
            color: var(--ps-blue-dark);
            border-color: var(--ps-gold-rich);
        }

        .page-badge {
            color: var(--ps-gold-bright);
            font-weight: 700;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 14px;
            border-radius: 20px;
        }

        .viewport {
            position: relative;
            width: 100%;
            height: 600px;
            background: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            perspective: 2200px;
        }

        .book-container {
            position: relative;
            width: 900px;
            height: 540px;
            background: #ffffff;
            border-radius: 6px;
            box-shadow: var(--ps-shadow);
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
        }

        .book-spine {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(0, 0, 0, 0.15);
            z-index: 15;
            transform: translateX(-50%);
        }

        .base-page {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background-color: var(--ps-cream);
            padding: 36px 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .base-left { left: 0; border-radius: 6px 0 0 6px; }
        .base-right { right: 0; border-radius: 0 6px 6px 0; }

        .flipper-sheet {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            z-index: 20;
        }

        .flipper-sheet.flip-right-to-left { right: 0; transform-origin: left center; }
        .flipper-sheet.flip-left-to-right { left: 0; transform-origin: right center; }

        .flipper-face {
            position: absolute;
            inset: 0;
            background-color: var(--ps-cream);
            padding: 36px 32px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .face-front { z-index: 2; }
        .face-back { transform: rotateY(180deg); }

        .page-header-line {
            display: flex;
            justify-content: space-between;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--ps-gold-rich);
            border-bottom: 2px solid var(--ps-gold-rich);
            padding-bottom: 8px;
        }

        .page-content-body { flex: 1; padding: 20px 0; }
        .page-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--ps-blue-dark); margin-bottom: 12px; }
        .page-text { font-size: 0.88rem; color: #334155; line-height: 1.65; }

        .highlight-box {
            background: rgba(197, 160, 89, 0.1);
            border-left: 3px solid var(--ps-gold-rich);
            padding: 12px;
            font-style: italic;
            margin-top: 10px;
        }

        .page-footer-line {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #64748b;
            border-top: 1px solid #e2e8f0;
            padding-top: 10px;
        }

        .cover-page {
            background: linear-gradient(135deg, var(--ps-blue-dark) 0%, #0f2b4c 100%);
            color: #ffffff;
            text-align: center;
            justify-content: center;
            align-items: center;
        }

        .cover-title { font-family: 'Cinzel', serif; font-size: 2.5rem; color: var(--ps-gold-bright); }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            cursor: pointer;
            z-index: 30;
            font-size: 1.2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .nav-btn-left { left: 20px; }
        .nav-btn-right { right: 20px; }
    </style>
</head>
<body>

    <div class="brand-header">
        <h1>INKSPIRE</h1>
        <p>Presidency School Banashankari • Official Digital Newsletter</p>
    </div>

    <div class="flipbook-window">
        <div class="progress-bar-container"><div class="progress-bar" id="autoProgressBar"></div></div>

        <div class="toolbar">
            <div>
                <button class="btn" id="prevBtn">◀ Previous</button>
                <button class="btn" id="nextBtn">Next ▶</button>
            </div>
            <span class="page-badge" id="pageIndicator">Page 1-2 / 8</span>
            <div>
                <button class="btn" id="autoPlayBtn">▶ Auto-Play</button>
                <button class="btn" id="soundBtn">🔊 Sound: ON</button>
            </div>
        </div>

        <div class="viewport">
            <button class="nav-btn nav-btn-left" id="arrowPrev">❮</button>
            <div class="book-container" id="bookStage">
                <div class="book-spine"></div>
                <div class="base-page base-left" id="baseLeft"></div>
                <div class="base-page base-right" id="baseRight"></div>
            </div>
            <button class="nav-btn nav-btn-right" id="arrowNext">❯</button>
        </div>
    </div>

    <script>
        const pages = [
            { type: 'cover', title: 'INKSPIRE', tag: 'Issue 12 • Term I', footer: 'Presidency School Banashankari' },
            { type: 'standard', category: 'PRINCIPAL\'S DESK', title: 'Nurturing Visionaries for Tomorrow', text: 'Welcome to this digital edition of INKSPIRE. At Presidency School Banashankari, we believe education extends beyond classrooms into critical thinking and innovation.', highlight: '"Education is not the learning of facts, but the training of the mind to think."', footer: 'Presidency School' },
            { type: 'standard', category: 'ACADEMIC ACHIEVEMENTS', title: 'STEM & Innovation Summit', text: 'Our students showcased groundbreaking prototypes including automated hydroponics and AI traffic models.', highlight: 'Over 45 student projects commended.', footer: 'Academics & Research' },
            { type: 'standard', category: 'STUDENT LEADERSHIP', title: 'Investiture Ceremony', text: 'The formal swearing-in of the Student Council was conducted with immense pride.', highlight: 'Empowering student leadership.', footer: 'Campus Life' },
            { type: 'standard', category: 'CULTURAL CORNER', title: 'Literary & Fine Arts', text: 'From poetry recitals to oil pastel exhibits, INKSPIRE celebrates creative talents.', highlight: 'State Inter-School Expo Winners.', footer: 'Creative Arts' },
            { type: 'standard', category: 'SPORTS BULLETIN', title: 'Champions on the Field', text: 'Basketball and badminton teams secured gold trophies at the Regional Tournament.', highlight: 'Overall Champions 3 years in a row.', footer: 'Sports Dept' },
            { type: 'standard', category: 'PRIMARY WING', title: 'Joyful Explorations', text: 'Young learners participated in nature walks, junior coding, and storytelling.', highlight: 'Play-based collaborative learning.', footer: 'Junior Wing' },
            { type: 'standard', category: 'EPILOGUE', title: 'Looking Ahead', text: 'Gratitude to teachers, parents, and student editors. Stay curious and inspired!', highlight: 'See you at the Annual Day!', footer: 'Editorial Board' }
        ];

        let currentSpread = 0;
        let totalSpreads = Math.ceil(pages.length / 2);
        let isAnimating = false;
        let isAutoPlaying = false;
        let soundEnabled = true;
        let progressInterval = null;

        function playPageTurnSound() {
            if (!soundEnabled) return;
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const buffer = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < buffer.length; i++) data[i] = Math.random() * 2 - 1;
                const noise = ctx.createBufferSource();
                noise.buffer = buffer;
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 800;
                const gain = ctx.createGain();
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.18);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);
                noise.start();
            } catch (e) {}
        }

        function getPageHTML(index) {
            if (index >= pages.length) return `<div style="text-align:center; padding-top:40%; color:#94a3b8;">End</div>`;
            const p = pages[index];
            if (p.type === 'cover') {
                return `<div class="flipper-face cover-page">
                    <h2 class="cover-title">${p.title}</h2>
                    <p style="margin:15px 0; font-size:0.9rem;">${p.tag}</p>
                    <p style="font-size:0.8rem; color:var(--ps-gold-rich);">${p.footer}</p>
                </div>`;
            }
            return `
                <div class="page-header-line"><span>INKSPIRE</span><span>${p.category}</span></div>
                <div class="page-content-body">
                    <h3 class="page-title">${p.title}</h3>
                    <p class="page-text">${p.text}</p>
                    ${p.highlight ? `<div class="highlight-box">${p.highlight}</div>` : ''}
                </div>
                <div class="page-footer-line"><span>${p.footer}</span><span>Page ${index + 1}</span></div>
            `;
        }

        function renderSpread() {
            const leftIdx = currentSpread * 2;
            const rightIdx = currentSpread * 2 + 1;
            document.getElementById('baseLeft').innerHTML = getPageHTML(leftIdx);
            document.getElementById('baseRight').innerHTML = getPageHTML(rightIdx);
            document.getElementById('pageIndicator').textContent = `Page ${leftIdx + 1}-${Math.min(rightIdx + 1, pages.length)} / ${pages.length}`;
        }

        function flipForward() {
            if (isAnimating || currentSpread >= totalSpreads - 1) return;
            isAnimating = true;
            playPageTurnSound();

            const rightIdx = currentSpread * 2 + 1;
            const nextLeftIdx = (currentSpread + 1) * 2;
            const nextRightIdx = (currentSpread + 1) * 2 + 1;

            document.getElementById('baseRight').innerHTML = getPageHTML(nextRightIdx);

            const flipper = document.createElement('div');
            flipper.className = 'flipper-sheet flip-right-to-left';
            flipper.innerHTML = `
                <div class="flipper-face face-front">${getPageHTML(rightIdx)}</div>
                <div class="flipper-face face-back">${getPageHTML(nextLeftIdx)}</div>
            `;
            document.getElementById('bookStage').appendChild(flipper);

            void flipper.offsetWidth; // Force CSS Reflow
            flipper.style.transform = 'rotateY(-180deg)';

            setTimeout(() => {
                currentSpread++;
                renderSpread();
                flipper.remove();
                isAnimating = false;
            }, 800);
        }

        function flipBackward() {
            if (isAnimating || currentSpread <= 0) return;
            isAnimating = true;
            playPageTurnSound();

            const prevLeftIdx = (currentSpread - 1) * 2;
            const prevRightIdx = (currentSpread - 1) * 2 + 1;
            const currentLeftIdx = currentSpread * 2;

            document.getElementById('baseLeft').innerHTML = getPageHTML(prevLeftIdx);

            const flipper = document.createElement('div');
            flipper.className = 'flipper-sheet flip-left-to-right';
            flipper.style.transform = 'rotateY(-180deg)';
            flipper.innerHTML = `
                <div class="flipper-face face-front">${getPageHTML(currentLeftIdx)}</div>
                <div class="flipper-face face-back">${getPageHTML(prevRightIdx)}</div>
            `;
            document.getElementById('bookStage').appendChild(flipper);

            void flipper.offsetWidth; // Force CSS Reflow
            flipper.style.transform = 'rotateY(0deg)';

            setTimeout(() => {
                currentSpread--;
                renderSpread();
                flipper.remove();
                isAnimating = false;
            }, 800);
        }

        function toggleAutoPlay() {
            if (isAutoPlaying) {
                isAutoPlaying = false;
                document.getElementById('autoPlayBtn').classList.remove('active');
                document.getElementById('autoPlayBtn').innerHTML = '▶ Auto-Play';
                clearInterval(progressInterval);
                document.getElementById('autoProgressBar').style.width = '0%';
            } else {
                isAutoPlaying = true;
                document.getElementById('autoPlayBtn').classList.add('active');
                document.getElementById('autoPlayBtn').innerHTML = '❚❚ Pause';
                let p = 0;
                progressInterval = setInterval(() => {
                    p += 2.5;
                    document.getElementById('autoProgressBar').style.width = p + '%';
                    if (p >= 100) {
                        p = 0;
                        if (currentSpread >= totalSpreads - 1) currentSpread = -1;
                        flipForward();
                    }
                }, 80);
            }
        }

        document.getElementById('nextBtn').onclick = flipForward;
        document.getElementById('prevBtn').onclick = flipBackward;
        document.getElementById('arrowNext').onclick = flipForward;
        document.getElementById('arrowPrev').onclick = flipBackward;
        document.getElementById('autoPlayBtn').onclick = toggleAutoPlay;
        document.getElementById('soundBtn').onclick = (e) => {
            soundEnabled = !soundEnabled;
            e.target.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
        };

        renderSpread();
    </script>
</body>
</html>
