<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heat Waves — School Magazine</title>

    <!-- Google Fonts & FontAwesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- PageFlip Engine (3D Physics) -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>

    <!-- ==================== HERO / HOME SCREEN ==================== -->
    <section id="hero-screen" class="hero-container">
        <div class="hero-card">
            <span class="school-badge"><i class="fa-solid fa-graduation-cap"></i> OFFICIAL SCHOOL NEWSLETTER</span>
            <h1 class="magazine-title">HEAT WAVES</h1>
            <p class="issue-subtitle">ISSUE 24 • TERM 1 EDITION</p>
            
            <p class="hero-desc">
                Welcome to our student-run school magazine! Dive into sports highlights, creative writing, club updates, and upcoming campus events.
            </p>

            <div class="hero-buttons">
                <button id="btn-launch" class="btn-primary">
                    <i class="fa-solid fa-book-open"></i> READ MAGAZINE
                </button>
                <button id="btn-toc-hero" class="btn-secondary">
                    <i class="fa-solid fa-list"></i> CONTENTS
                </button>
            </div>
        </div>
    </section>

    <!-- ==================== MAGAZINE READER ==================== -->
    <main id="reader-screen" class="reader-container hidden">
        
        <!-- Top Toolbar -->
        <header class="top-toolbar">
            <button id="btn-back" class="tb-btn" title="Back to Home">
                <i class="fa-solid fa-house"></i> Home
            </button>

            <div class="page-controls">
                <button id="btn-prev" class="tb-btn" title="Previous Page"><i class="fa-solid fa-chevron-left"></i></button>
                <span id="page-counter" class="page-indicator">Page 1 of 6</span>
                <button id="btn-next" class="tb-btn" title="Next Page"><i class="fa-solid fa-chevron-right"></i></button>
            </div>

            <div class="toolbar-right">
                <button id="btn-toggle-toc" class="tb-btn" title="Table of Contents"><i class="fa-solid fa-border-all"></i> Pages</button>
                <button id="btn-toggle-sound" class="tb-btn active" title="Sound Toggle"><i class="fa-solid fa-volume-high"></i></button>
            </div>
        </header>

        <!-- Flipbook Viewport -->
        <div class="flipbook-viewport">
            <div id="flipbook" class="flipbook-wrapper">
                <!-- Canvas pages generated dynamically by JavaScript -->
            </div>
        </div>

    </main>

    <!-- ==================== TABLE OF CONTENTS MODAL ==================== -->
    <div id="toc-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Quick Page Navigation</h2>
                <button id="btn-close-toc" class="close-btn">&times;</button>
            </div>
            <div id="toc-grid" class="toc-grid">
                <!-- Thumbnails generated dynamically -->
            </div>
        </div>
    </div>

    <!-- Main Logic -->
    <script src="script.js"></script>
</body>
</html>
